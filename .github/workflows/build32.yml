name: Build 32-bit

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake for Windows 7 32-bit
      run: cmake -B build -A Win32 -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" -DCMAKE_CXX_FLAGS="/DWINVER=0x0601 /D_WIN32_WINNT=0x0601" -DCMAKE_C_FLAGS="/DWINVER=0x0601 /D_WIN32_WINNT=0x0601"

    - name: Build Release
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HIDeous-32bit
        path: |
          build/**/*.exe
          build/**/*.dll
          *.txt
          *.ini
          settings*
